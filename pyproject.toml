[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopher-orch"
version = "0.1.0"
description = "Python SDK for Gopher Orch - AI Agent orchestration framework with native performance"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gopher Security", email = "dev@gophersecurity.com"}
]
keywords = ["gopher", "mcp", "ai", "agent", "orchestration", "llm", "ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/GopherSecurity/gopher-mcp-python"
Repository = "https://github.com/GopherSecurity/gopher-mcp-python.git"
Issues = "https://github.com/GopherSecurity/gopher-mcp-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gopher_orch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
