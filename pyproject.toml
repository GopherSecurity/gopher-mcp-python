[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopher-mcp-python"
version = "0.1.38"
description = "Python SDK for Gopher MCP - AI Agent orchestration framework with native performance"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gopher Security", email = "dev@gophersecurity.com"}
]
keywords = ["gopher", "mcp", "ai", "agent", "orchestration", "llm", "ffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
# Platform-specific native library packages
darwin-arm64 = ["gopher-mcp-python-native-darwin-arm64>=0.1.0"]
darwin-x64 = ["gopher-mcp-python-native-darwin-x64>=0.1.0"]
linux-arm64 = ["gopher-mcp-python-native-linux-arm64>=0.1.0"]
linux-x64 = ["gopher-mcp-python-native-linux-x64>=0.1.0"]
win32-arm64 = ["gopher-mcp-python-native-win32-arm64>=0.1.0"]
win32-x64 = ["gopher-mcp-python-native-win32-x64>=0.1.0"]

[project.urls]
Homepage = "https://github.com/GopherSecurity/gopher-mcp-python"
Repository = "https://github.com/GopherSecurity/gopher-mcp-python.git"
Issues = "https://github.com/GopherSecurity/gopher-mcp-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gopher_mcp_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | native
)/
'''

[tool.ruff]
line-length = 88
target-version = "py38"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "native",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["gopher_mcp_python"]
