name: OAuth Verify

on:
  push:
    branches: [main, feature/sdk-oauth-verify]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-idp-oauth:
    name: Custom IdP OAuth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # SDK tests use committed fixtures and fake native bindings.
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run custom IdP OAuth verification
        run: scripts/test-oauth-custom-idp.sh

      - name: Verify inventory and embedded OAuth host contracts
        run: >-
          python -m pytest
          tests/test_source_selection.py
          tests/test_server_config.py
          tests/test_inventory_response.py
          tests/test_inventory_conformance.py
          tests/test_inventory_factories.py
          tests/test_oauth_inventory_scoping.py
          tests/test_embedded_auth_bindings.py
          tests/test_embedded_auth.py
          tests/test_embedded_auth_lifecycle.py
