[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopher-security-mcp-native-darwin-x64"
version = "0.1.0.dev20260226145002"
description = "Native library for gopher-security-mcp (macOS Intel)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gopher Security", email = "dev@gophersecurity.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/GopherSecurity/gopher-mcp-python"
Repository = "https://github.com/GopherSecurity/gopher-mcp-python"

[tool.setuptools]
packages = ["gopher_security_mcp_native_darwin_x64"]

[tool.setuptools.package-data]
gopher_security_mcp_native_darwin_x64 = ["lib/*"]
